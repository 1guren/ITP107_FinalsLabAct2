name: flutter_application_2
description: "A Flutter Hive CRUD To-Do List application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Hive local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Required Hive development dependencies
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true